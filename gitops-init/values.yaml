#### this is variablization done for the templates of app-group.yaml, 
#### for creating new app-project resources follow the below standard of putting variable values.
app_group_param:
  cluster-config:
    project_name: cluster-config
    namespace: 
      - openshift-operators
      - openshift-gitops-operator
      - "*"
    cs_apiObject:
      - rg_name: ""
        rg_kind: Namespace
    ns_apiObject:
      - rg_name: operators.coreos.com
        rg_kind: OperatorGroup
      - rg_name: operators.coreos.com
        rg_kind: Subscription
  cluster-storage-config:
    project_name: cluster-storage-config
    namespace:
      - openshift-local-storage
      - openshift-storage
    cs_apiObject:
      - rg_name: ""
        rg_kind: Namespace
    ns_apiObject:
      - rg_name: operators.coreos.com
        rg_kind: OperatorGroup
      - rg_name: operators.coreos.com
        rg_kind: Subscription
      - rg_name: local.storage.openshift.io
        rg_kind: LocalVolume
      - rg_name: ocs.openshift.io
        rg_kind: StorageCluster
  cluster-security-config:
    project_name: cluster-security-config
    namespace: 
      - cert-manager-operator
      - openshift-compliance
      - openshift-operators
      - rhacs-operator
      - "*"
    cs_apiObject:
      - rg_name: ""
        rg_kind: Namespace
      - rg_name: config.openshift.io
        rg_kind: OAuth
    ns_apiObject:
      - rg_name: operators.coreos.com
        rg_kind: OperatorGroup
      - rg_name: operators.coreos.com
        rg_kind: Subscription
  cluster-reliability-config:
    project_name: cluster-reliability-config
    namespace:
      - openshift-logging
      - openshift-operators-redhat
      - openshift-cluster-observability-operator
      - openshift-opentelemetry-operator
      - openshift-monitoring
    cs_apiObject:
      - rg_name: ""
        rg_kind: Namespace
    ns_apiObject:
      - rg_name: operators.coreos.com
        rg_kind: OperatorGroup
      - rg_name: operators.coreos.com
        rg_kind: Subscription
      - rg_name: objectbucket.io
        rg_kind: ObjectBucketClaim
      - rg_name: loki.grafana.com
        rg_kind: LokiStack
      - rg_name: ""
        rg_kind: ConfigMap
  cluster-networking-config-group:
    project_name: cluster-networking-config-group
    namespace:
      - cilium
      - metallb-system
    cs_apiObject:
      - rg_name: cilium.io
        rg_kind: CiliumConfig
      - rg_name: cilium.io
        rg_kind: CiliumClusterwideNetworkPolicy
    ns_apiObject:
      - rg_name: operators.coreos.com
        rg_kind: OperatorGroup
      - rg_name: operators.coreos.com
        rg_kind: Subscription
      - rg_name: ""
        rg_kind: ConfigMap
      - rg_name: ""
        rg_kind: Pod
      - rg_name: ""
        rg_kind: Service
      - rg_name: route.openshift.io
        rg_kind: Route
      - rg_name: ""
        rg_kind: Secret
      - rg_name: apps
        rg_kind: Deployment
      - rg_name: apps
        rg_kind: DaemonSet

### Below configuration is to create Application CR for argoCD, For ArgoCD to manage cluster resource of any scope
### We need to create Application CR which needs information about application name, project name, and 
### namespace as well as kuberentes cluster where it will manage the resource and Git source of truth which it will 
### use as source of truth, application-name and project-name are purely ArgoCD gitops terminology and is used by ArgoCD only
### for managing resources under it, Do not map them with application name or namespace of openshift.
applications:
  - application_name: local-storage-application
    namespace: openshift-local-storage
    project_name: cluster-storage-config
    path: dev/cluster-storage/local-storage-operator-chart
  - application_name: odf-application
    namespace: openshift-storage
    project_name: cluster-storage-config
    path: dev/cluster-storage/odf-operator-chart
  - application_name: cluster-network-application
    namespace: cilium
    project_name: cluster-networking-config-group
    path: dev/cluster-networking/cilium-chart
  - application_name: metallb-application
    namespace: metallb-system
    project_name: cluster-networking-config-group
    path: dev/cluster-networking/metallb-operator-chart
  - application_name: quay-application
    namespace: "*"
    project_name: cluster-config
    path: dev/cluster-config/quay-operator-chart
  - application_name: cluster-security-application
    namespace: cert-manager-operator
    project_name: cluster-security-config
    path: dev/cluster-reliability/cert-manager-chart
  - application_name: rhacs-application
    namespace: rhacs-operator
    project_name: cluster-security-config
    path: dev/cluster-security/rhacs-operator-chart
  - application_name: oauth-application
    namespace: "*"
    project_name: cluster-security-config
    path: dev/cluster-security/identity-provider-chart
  - application_name: compliace-operator-application
    namespace: openshift-compliance
    project_name: cluster-security-config
    path: dev/cluster-reliability/compliance-operator-chart
  - application_name: service-mesh-application
    namespace: openshift-operators
    project_name: cluster-security-config
    path: dev/cluster-networking/istio-operator-chart
  - application_name: opentelemetry-application
    namespace: openshift-opentelemetry-operator
    project_name: cluster-reliability-config
    path: dev/cluster-reliability/otel-operator-chart
  - application_name: openshift-logging-application
    namespace: openshift-logging
    project_name: cluster-reliability-config
    path: dev/cluster-reliability/logging-operator-chart
  - application_name: loki-application
    namespace: openshift-operators-redhat
    project_name: cluster-reliability-config
    path: dev/cluster-reliability/loki-operator-chart
  - application_name: cluster-observability-application
    namespace: openshift-cluster-observability-operator
    project_name: cluster-reliability-config
    path: dev/cluster-reliability/cluster-observability-operator-chart
  - application_name: cluster-monitoring-application
    namespace: openshift-monitoring
    project_name: cluster-reliability-config
    path: dev/cluster-reliability/openshift-monitoring-chart


