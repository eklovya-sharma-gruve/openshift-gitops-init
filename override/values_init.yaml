app_group_param:
  gitops-init:
    project_name: gitops-init
    namespace:
      - openshift-gitops
    cs_apiObject:
      - rg_name: ""
        rg_kind: Namespace
      - rg_name: user.openshift.io
        rg_kind: Group
      - rg_name: rbac.authorization.k8s.io
        rg_kind: ClusterRoleBinding
    ns_apiObject:
      - rg_name: argoproj.io
        rg_kind: Application
      - rg_name: argoproj.io
        rg_kind: AppProject
  gitops-cluster-config:
    project_name: gitops-cluster-config
    namespace:
      - openshift-gitops
    cs_apiObject:
      - rg_name: ""
        rg_kind: Namespace
    ns_apiObject:
      - rg_name: argoproj.io
        rg_kind: Application
      - rg_name: argoproj.io
        rg_kind: AppProject

applications:
  - application_name: gitops-first-instance
    namespace: "openshift-gitops"
    project_name: gitops-init
    path: gitops-init/

